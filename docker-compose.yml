# =============================================================================
#  SentinelPrice · Docker Compose
# =============================================================================
#  Orchestrates two services:
#    · db      — PostgreSQL 15 database (persistent volume)
#    · scraper — Scrapy extraction engine (connects to db)
#
#  Usage:
#    Start the stack:         docker-compose up --build
#    Run a crawl:             docker-compose run scraper scrapy crawl amazon_spider
#    Stop (keep data):        docker-compose down
#    Stop (wipe all data):    docker-compose down -v
#
#  Requirements:
#    Copy .env.example to .env and fill in your credentials before running.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  db · PostgreSQL 15
  # ---------------------------------------------------------------------------

  db:
    image: postgres:15-alpine
    container_name: sentinelprice_db
    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"       # Expose to host for pgAdmin / DBeaver access

    volumes:
      - postgres_data:/var/lib/postgresql/data          # Persistent data volume
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # Auto-run on first start

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval:   10s
      timeout:    5s
      retries:    5
      start_period: 10s

    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  #  scraper · Scrapy extraction engine
  # ---------------------------------------------------------------------------

  scraper:
    build:
      context:    ./scrapers
      dockerfile: Dockerfile
    container_name: sentinelprice_scraper
    restart: "no"           # Scrapy runs as a job, not a long-running service

    env_file:
      - .env                # Loads all .env variables into the container

    environment:
      # Explicitly pass DB host so psycopg2 connects to the db service
      POSTGRES_HOST: db

    volumes:
      - ./scrapers:/app     # Mount source for live code changes without rebuild
      - scraper_logs:/app/logs

    depends_on:
      db:
        condition: service_healthy   # Wait for PostgreSQL to be ready before starting

    networks:
      - sentinel_net

    # Default command — override at runtime:
    #   docker-compose run scraper scrapy crawl amazon_spider
    command: ["scrapy", "list"]     # Lists available spiders on plain `docker-compose up`


  # ---------------------------------------------------------------------------
  #  api · FastAPI REST layer
  # ---------------------------------------------------------------------------

  api:
    build:
      context:    ./api
      dockerfile: Dockerfile
    container_name: sentinelprice_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db

    ports:
      - "8000:8000"     # API accessible at http://localhost:8000
                        # Swagger UI at  http://localhost:8000/docs

    volumes:
      - ./api:/app      # Mount source for live reload without rebuild

    depends_on:
      db:
        condition: service_healthy

    networks:
      - sentinel_net


  # ---------------------------------------------------------------------------
  #  grafana · Price intelligence dashboard
  # ---------------------------------------------------------------------------

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sentinelprice_grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL:         http://localhost:3000
      GF_INSTALL_PLUGINS:         grafana-clock-panel
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_DB:                ${POSTGRES_DB}

    ports:
      - "3000:3000"     # Grafana UI at http://localhost:3000

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      db:
        condition: service_healthy

    networks:
      - sentinel_net


  # ---------------------------------------------------------------------------
  #  airflow · Workflow scheduler
  # ---------------------------------------------------------------------------

  airflow:
    build:
      context:    ./airflow
      dockerfile: Dockerfile
    container_name: sentinelprice_airflow
    restart: unless-stopped

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR:                    LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY:                  ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES:               "false"
      AIRFLOW__WEBSERVER__SECRET_KEY:             ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG:          "true"
      AIRFLOW__WEBSERVER__BASE_URL:               "http://localhost:8080"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER:          /opt/airflow/logs
      AIRFLOW__LOGGING__LOGGING_LEVEL:            INFO
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL:  30
      # Pass project env vars through to DAG BashOperators
      POSTGRES_HOST:    db
      POSTGRES_USER:    ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:      ${POSTGRES_DB}

    ports:
      - "8080:8080"     # Airflow UI at http://localhost:8080

    volumes:
      - ./airflow/dags:/opt/airflow/dags          # DAG files
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock  # Allows DAGs to run docker-compose
      - .:/opt/sentinelprice                        # Project root — required by DAG BashOperators

    depends_on:
      db:
        condition: service_healthy

    networks:
      - sentinel_net

    command: >
      bash -c "
        airflow db upgrade &&
        sleep 5 &&
        airflow users create
          --username ${AIRFLOW_ADMIN_USER:-admin}
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
          --firstname SentinelPrice
          --lastname Admin
          --role Admin
          --email admin@sentinelprice.local 2>/dev/null || true &&
        airflow webserver &
        airflow scheduler
      "


# =============================================================================
#  Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
    labels:
      com.sentinelprice.description: "PostgreSQL persistent data"

  scraper_logs:
    driver: local
    labels:
      com.sentinelprice.description: "Scrapy crawl logs"

  airflow_logs:
    driver: local
    labels:
      com.sentinelprice.description: "Airflow task and scheduler logs"

  grafana_data:
    driver: local
    labels:
      com.sentinelprice.description: "Grafana dashboard state and user data"


# =============================================================================
#  Networks
# =============================================================================

networks:
  sentinel_net:
    driver: bridge
    labels:
      com.sentinelprice.description: "Internal network for db ↔ scraper communication"