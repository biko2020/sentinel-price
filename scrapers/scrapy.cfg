# =============================================================================
#  SentinelPrice · Scrapy Configuration
# =============================================================================
#  This file is the entry point Scrapy uses to locate the project settings.
#  It is required at the root of every Scrapy project.
#
#  Docs: https://docs.scrapy.org/en/latest/topics/commands.html
# =============================================================================

[settings]
# Default settings module — used for all local and Docker runs
default = sentinel_spiders.settings

[deploy:local]
# Local deployment (direct scrapy crawl commands)
project = sentinelprice

[deploy:scrapyd]
# Scrapyd deployment — update url to point to your Scrapyd server
# Usage: scrapyd-deploy scrapyd
url     = http://localhost:6800/
project = sentinelprice